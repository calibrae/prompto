# /etc/ssh/sshd_config.d/60-sbxtunnel.conf on the sandbox host.
# The Mac host's VM reverse-forwards into <sandbox-bridge-ip>:2222 and nothing else
# (authorized_keys also carries restrict,port-forwarding,permitlisten="<sandbox-bridge-ip>:2222").
Match User sbxtunnel
  AllowTcpForwarding remote
  GatewayPorts clientspecified
  PermitTTY no
  X11Forwarding no
  AllowAgentForwarding no
  PermitTunnel no
  ForceCommand /sbin/nologin
